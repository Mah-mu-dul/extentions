<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Vanish</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">

    <header class="app__header">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="6.5" stroke="currentColor" stroke-width="2"/>
            <line x1="6.5" y1="17.5" x2="17.5" y2="6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand__name">Vanish</span>
      </div>
      <div class="site" id="siteLabel" title="">this site</div>
    </header>

    <section class="composer">
      <div class="field">
        <input
          id="selectorInput"
          type="text"
          placeholder=".modal-overlay  or  #cookie-banner  or  a b c"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="addBtn" class="btn btn--accent" title="Add and hide">Add</button>
      </div>
      <p class="hint">Type a class or id. Separate names with a space to target one element that has all of them, e.g. <code>modal show active</code>.</p>
    </section>

    <section class="list-section">
      <div class="list-section__head">
        <span id="countLabel">0 rules on this site</span>
        <button id="deleteAllBtn" class="link-btn" disabled>Delete all</button>
      </div>
      <div id="toastList" class="toast-list" aria-live="polite">
        <div id="emptyState" class="empty-state">
          Nothing hidden here yet. Add a class or id above to make it vanish.
        </div>
      </div>
    </section>

    <footer class="app__footer">
      <button id="refreshBtn" class="btn btn--ghost">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 11A8 8 0 1 0 19.5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20 5v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Refresh page
      </button>
      <span id="statusMsg" class="status" role="status"></span>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
