<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        min-width: 200px;
        font-family: sans-serif;
      }
      .slider {
        width: 100%;
      }
      .label {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div>
      <label for="speedRange" class="label"
        >Speed: <span id="speedValue">1.00x</span></label
      >
      <input
        type="range"
        min="0.25"
        max="3.0"
        step="0.05"
        value="1.00"
        id="speedRange"
        class="slider"
      />
    </div>
    <script src="popup.js"></script>
  </body>
</html>
